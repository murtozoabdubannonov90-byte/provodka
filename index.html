<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Provodka — 30 kunlik kurs</title>
<meta name="theme-color" content="#EFF3EA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --paper:#EFF3EA;
  --band:#DFE8D8;
  --rule:#A9BFA6;
  --rule-soft:#C6D5C2;
  --ink:#141E18;
  --ink-2:#4A5A4E;
  --ink-3:#77877A;
  --ok:#256B4A;
  --ok-bg:#DCEBDF;
  --no:#9E3324;
  --no-bg:#F2DED9;
  --card:#FBFCF8;
  --shadow:0 1px 0 var(--rule-soft);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 0 64px;
  overscroll-behavior-y:contain;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  padding:22px 0 14px;
  border-bottom:2px solid var(--rule);
  margin-bottom:18px;
}
.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;margin:0 0 4px;
}
h1{
  font:700 27px/1.15 Georgia,"Times New Roman",serif;
  margin:0;letter-spacing:-.01em;
}
.sub{color:var(--ink-2);font-size:14px;margin:6px 0 0}

/* ---------- progress ---------- */
.prog{margin:16px 0 4px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.prog-top b{font-size:14px;color:var(--ink)}
.bar{height:9px;background:var(--band);border:1px solid var(--rule-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .35s ease}

/* ---------- day grid ---------- */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:18px 0 8px}
.d{
  aspect-ratio:1;border:1px solid var(--rule);background:var(--card);
  color:var(--ink);font:600 15px/1 ui-monospace,Menlo,monospace;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;
}
.d.done{background:var(--ok);border-color:var(--ok);color:#fff}
.d.now{outline:2px solid var(--ink);outline-offset:-3px}
.d.lock{color:var(--ink-3);background:var(--band);border-color:var(--rule-soft);cursor:not-allowed}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border:1px solid var(--rule)}
.sw.done{background:var(--ok);border-color:var(--ok)}
.sw.lock{background:var(--band)}

/* ---------- day view ---------- */
.back{
  background:none;border:none;padding:8px 0;margin:12px 0 2px;
  font:600 13px/1 inherit;color:var(--ink-2);cursor:pointer;
  display:flex;align-items:center;gap:7px;
}
.daynum{
  font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;
  color:var(--ink-3);text-transform:uppercase;margin:8px 0 5px;
}
h2{font:700 22px/1.25 Georgia,"Times New Roman",serif;margin:0 0 16px}

.card{
  background:var(--card);border:1px solid var(--rule-soft);
  border-left:3px solid var(--rule);
  padding:15px 16px;margin:0 0 16px;
}
.card p{margin:0 0 11px;font-size:15px}
.card p:last-child{margin-bottom:0}
.card b{font-weight:650}
.pv{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13.5px;background:var(--band);padding:1px 6px;
  white-space:nowrap;display:inline-block;
}
.fm{
  font-family:ui-monospace,Menlo,monospace;font-size:14px;
  background:var(--band);padding:10px 12px;text-align:center;
}

/* account table — ledger banding */
table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14px}
td{padding:8px 10px;border-bottom:1px solid var(--rule-soft)}
tr:nth-child(odd) td{background:var(--band)}
tr:nth-child(even) td{background:var(--card)}
td:first-child{
  font-family:ui-monospace,Menlo,monospace;font-weight:600;
  width:78px;white-space:nowrap;border-right:1px solid var(--rule-soft);
}

/* ---------- quiz ---------- */
.qhead{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--rule);padding-top:12px;margin-top:4px;
}
.qhead .lbl{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.qhead .sc{font:600 13px/1 ui-monospace,Menlo,monospace;color:var(--ink-2)}
.q{font-size:17px;font-weight:600;margin:12px 0 14px;line-height:1.4}

.opts{display:flex;flex-direction:column;gap:8px}
.o{
  width:100%;text-align:left;background:var(--card);
  border:1px solid var(--rule);padding:0;cursor:pointer;
  font:inherit;color:var(--ink);overflow:hidden;
}
.o:disabled{cursor:default}
.o:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* T-schyot ko'rinishi */
.t{display:flex;align-items:stretch;min-height:46px}
.t .side{flex:1;padding:11px 12px;display:flex;align-items:center;gap:8px}
.t .side:first-child{border-right:1px solid var(--rule)}
.t .k{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:700}
.t .v{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:600}
.plain{padding:12px;font-size:15px}
.o.ok{background:var(--ok-bg);border-color:var(--ok)}
.o.ok .t .side:first-child,.o.ok .t .side{border-color:var(--ok)}
.o.no{background:var(--no-bg);border-color:var(--no)}
.o.dim{opacity:.5}
.mark{
  float:right;font:700 13px/1 ui-monospace,Menlo,monospace;
  padding:12px 12px 0 0;
}
.o.ok .mark{color:var(--ok)}
.o.no .mark{color:var(--no)}

.why{
  margin:12px 0 0;padding:12px 13px;font-size:14.5px;
  border-left:3px solid var(--ok);background:var(--ok-bg);
}
.why.no{border-left-color:var(--no);background:var(--no-bg)}
.why b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}

.btn{
  display:block;width:100%;margin:16px 0 0;padding:14px;
  background:var(--ink);color:var(--paper);border:none;
  font:600 15px/1 inherit;cursor:pointer;
}
.btn:disabled{background:var(--rule);color:var(--ink-3);cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--rule)}

.done-box{border:2px solid var(--ok);background:var(--ok-bg);padding:18px;text-align:center;margin-top:18px}
.done-box .big{font:700 34px/1 Georgia,serif;margin-bottom:4px}
.done-box .cap{font-size:14px;color:var(--ink-2)}

.locked{text-align:center;padding:36px 18px;color:var(--ink-2);font-size:15px}
.hide{display:none}
footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule-soft);font-size:12px;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:520px){.grid{grid-template-columns:repeat(10,1fr)}}
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Buxgalteriya mashqi</p>

<script>
const DAYS = [
{n:1,t:"Ikki yoqlama yozuv: Debet va Kredit",
th:`<p>Buxgalteriyaning butun mantig'i bitta qoidaga suyanadi: <b>har bir operatsiya kamida ikkita schyotda aks etadi</b>. Bittasining debetiga, ikkinchisining kreditiga — va summa har doim teng bo'ladi.</p>
<p>Nega shunday? Chunki pul yo'qdan paydo bo'lmaydi. Agar kassaga 1 mln so'm kirgan bo'lsa, u <i>qayerdandir</i> kelgan. Kassa ko'paydi (debet), manba kamaydi yoki qarz paydo bo'ldi (kredit).</p>
<p><b>Debet</b> — chap taraf. <b>Kredit</b> — o'ng taraf. Buxgalterlar buni "samolyotcha" (T-schyot) deb chizadi: ustiga schyot raqami, chapga debet, o'ngga kredit.</p>
<p>Yozilishi: <span class="pv">Dt 5010 — Kt 5110</span> deb o'qiladi: "besh o'n bir yuzning debetiga, besh bir yuz o'nning krediti bilan".</p>
<p><b>Muhim:</b> "debet" yaxshi, "kredit" yomon degani emas. Ular shunchaki chap va o'ng taraf. Ma'nosi schyot turiga qarab o'zgaradi — buni ertaga o'rganamiz.</p>`,
acc:[["5010","Kassa (milliy valyuta)"],["5110","Hisob-kitob schyoti (bank)"]],
q:[
{q:"Bankdan kassaga 5 mln so'm olindi. Provodka?",o:["Dt 5010 — Kt 5110","Dt 5110 — Kt 5010","Dt 5010 — Kt 6010","Dt 5110 — Kt 4010"],c:0,w:"Kassa ko'paydi → uning debetiga. Bankdagi pul kamaydi → uning krediti."},
{q:"Bitta provodkada debet va kredit summasi qanday bo'ladi?",o:["Har doim teng","Debet ko'proq","Kredit ko'proq","Farqi yo'q"],c:0,w:"Ikki yoqlama yozuvning asosiy qoidasi — tenglik. Teng bo'lmasa, xato bor."},
{q:"«Dt 5110 — Kt 5010» nimani bildiradi?",o:["Kassadan bankka pul topshirildi","Bankdan kassaga pul olindi","Xaridordan pul keldi","Yetkazib beruvchiga to'landi"],c:0,w:"Bank debetda → bankda pul ko'paydi. Kassa kreditda → kassadan chiqdi."},
{q:"T-schyotda (samolyotchada) debet qaysi tomonda?",o:["Chapda","O'ngda","Pastda","Yuqorida"],c:0,w:"Debet — har doim chapda, kredit — o'ngda. Bu shartli kelishuv, o'zgarmaydi."},
{q:"Bitta operatsiya nechta schyotga ta'sir qiladi?",o:["Kamida ikkitaga","Faqat bittaga","Har doim uchtaga","Hech qanday qoida yo'q"],c:0,w:"Kamida ikkitaga. Ba'zan ko'proq — masalan tovar + QQS bir provodkada uch schyotni qamraydi."},
{q:"Buxgalteriyada «provodka» nima?",o:["Operatsiyaning schyotlarda yozilishi","Hujjat nomi","Soliq turi","Hisobot shakli"],c:0,w:"Provodka (buxgalteriya yozuvi) — operatsiyani debet va kredit orqali qayd etish."}
]},

{n:2,t:"Aktiv va Passiv schyotlar",
th:`<p>Kecha debet va kredit shunchaki chap-o'ng ekanini bildik. Ular <b>nimani</b> anglatishi schyot turiga bog'liq.</p>
<p><b>Aktiv schyotlar</b> — korxonaning mulki: pul, tovar, materiallar, asosiy vositalar, sizga qarzdorlar. Balansning chap tomoni.<br>
Ko'paysa → <b>debetga</b>. Kamaysa → <b>kreditga</b>. Qoldiq (saldo) har doim <b>debetda</b> turadi.</p>
<p><b>Passiv schyotlar</b> — bu mulk qayerdan kelgani: ustav kapitali, foyda, qarzlar, soliqlar, ish haqi.<br>
Ko'paysa → <b>kreditga</b>. Kamaysa → <b>debetga</b>. Qoldiq <b>kreditda</b>.</p>
<p>Eslab qolish uchun oddiy tekshiruv: <i>"Bu menda bormi yoki men qarzdormanmi?"</i> Bor bo'lsa — aktiv. Qarz bo'lsa — passiv.</p>
<p>Mantiq: kassada pul ko'paysa debetga yozamiz. Yetkazib beruvchiga qarzim ko'paysa — kreditga. Qarzni to'lasam, qarz kamayadi → debetga.</p>`,
acc:[["Aktiv","5010, 5110, 4010, 2910, 1010, 0100"],["Passiv","6010, 6710, 6410, 8310, 8710"]],
q:[
{q:"5110 (hisob-kitob schyoti) qanday schyot?",o:["Aktiv","Passiv","Aktiv-passiv","Hech qaysi"],c:0,w:"Bankdagi pul — korxona mulki. Demak aktiv."},
{q:"6010 (mol yetkazib beruvchilar) qanday schyot?",o:["Passiv","Aktiv","Aktiv-passiv","Moliyaviy natija"],c:0,w:"Bu — sizning qarzingiz. Qarz = passiv."},
{q:"Aktiv schyotda mablag' ko'paysa, qayerga yoziladi?",o:["Debetga","Kreditga","Ikkalasiga","Yozilmaydi"],c:0,w:"Aktivda ko'payish har doim debetda."},
{q:"Passiv schyotda qarz kamaysa (to'lansa), qayerga yoziladi?",o:["Debetga","Kreditga","Ikkalasiga","Yozilmaydi"],c:0,w:"Passivda ko'payish kreditda bo'lgani uchun, kamayish teskari tomonga — debetga."},
{q:"Aktiv schyotning qoldig'i qayerda turadi?",o:["Debetda","Kreditda","Ikkalasida","Qoldiq bo'lmaydi"],c:0,w:"Aktiv schyot debet qoldig'i bilan yopiladi. Kassada minus pul bo'lmaydi."},
{q:"6710 (ish haqi) schyotining kredit qoldig'i nimani bildiradi?",o:["Xodimlarga qarzdorsiz","Xodimlar sizga qarzdor","Qarz yo'q","Ish haqi ortiqcha to'langan"],c:0,w:"Passiv schyotning kredit qoldig'i — to'lanmagan qarz. Ya'ni ish haqi hali berilmagan."}
]},

{n:3,t:"Hisoblar rejasi — schyot raqamlari mantig'i",
th:`<p>O'zbekiston hisoblar rejasida har bir schyot 4 xonali raqam. Birinchi raqam guruhni bildiradi — buni yodlab olsangiz, notanish schyotni ko'rganda ham nima ekanini taxmin qilasiz.</p>
<p><b>0xxx</b> — uzoq muddatli aktivlar (asosiy vositalar, nomoddiy aktivlar, kapital qo'yilmalar)<br>
<b>1xxx</b> — materiallar, xom ashyo<br>
<b>2xxx</b> — ishlab chiqarish xarajatlari, tayyor mahsulot, tovarlar<br>
<b>4xxx</b> — debitorlar (sizga qarzdorlar, berilgan bo'naklar)<br>
<b>5xxx</b> — pul mablag'lari (kassa, bank, valyuta)<br>
<b>6xxx</b> — kreditorlar (siz qarzdorsiz: yetkazib beruvchilar, soliq, ish haqi)<br>
<b>7xxx</b> — uzoq muddatli majburiyatlar (kreditlar)<br>
<b>8xxx</b> — kapital (ustav kapitali, foyda)<br>
<b>9xxx</b> — daromad va xarajatlar, moliyaviy natija</p>
<p>Eng foydali qoida: <b>4 — menga qarzdor, 6 — men qarzdorman</b>. Shu ikkitasini adashtirmasangiz, ishning yarmi bajarilgan.</p>
<p>Ikkinchi-uchinchi raqam turini aniqlashtiradi: 5010 kassa, 5110 bank, 5210 valyuta — hammasi 5, ya'ni pul.</p>`,
acc:[["4010","Xaridorlar qarzi (menga qarzdor)"],["6010","Yetkazib beruvchilarga qarz (men qarzdorman)"],["9020","Tovar sotishdan daromad"]],
q:[
{q:"4010 qaysi guruhga kiradi?",o:["Debitorlar — menga qarzdor","Kreditorlar — men qarzdorman","Pul mablag'lari","Kapital"],c:0,w:"4 bilan boshlanadi → debitor. Xaridor tovarni olgan, puli hali kelmagan."},
{q:"Pul mablag'lari qaysi raqam bilan boshlanadi?",o:["5","4","6","2"],c:0,w:"5xxx — kassa, bank, valyuta, maxsus schyotlar."},
{q:"Byudjetga soliq qarzi (6410) qaysi guruh?",o:["Kreditorlar","Debitorlar","Xarajatlar","Aktivlar"],c:0,w:"6 bilan boshlanadi → siz qarzdorsiz. Soliq hali to'lanmagan."},
{q:"Asosiy vositalar qaysi raqamda?",o:["0100","1010","2910","5010"],c:0,w:"0xxx — uzoq muddatli aktivlar. Asosiy vositalar 0100 guruhida."},
{q:"Daromad va xarajatlar qaysi guruhda?",o:["9xxx","8xxx","2xxx","6xxx"],c:0,w:"9xxx — moliyaviy natija guruhi. Yil oxirida yopiladi."},
{q:"Omborda turgan tovar qaysi schyotda?",o:["2910","1010","4010","0100"],c:0,w:"2910 — omborlardagi tovarlar. 1010 esa xom ashyo va materiallar."},
{q:"Ustav kapitali qaysi guruhda?",o:["8xxx","6xxx","5xxx","0xxx"],c:0,w:"8xxx — o'z kapitali. 8310 — ustav kapitali."}
]},

{n:4,t:"Kassa operatsiyalari (5010)",
th:`<p><b>5010 — Kassa</b>, aktiv schyot. Debetda pul kirimi, kreditda chiqimi. Qoldiq faqat debetda bo'ladi (kassada minus pul bo'lishi mumkin emas — bo'lsa, xato bor).</p>
<p>Har bir harakat hujjat bilan tasdiqlanadi:<br>
• <b>KO-1</b> — kirim orderi (pul kirganda)<br>
• <b>KO-2</b> — chiqim orderi (pul berilganda)<br>
• <b>Kassa kitobi</b> — kunlik qoldiq</p>
<p>Eng ko'p uchraydigan provodkalar:<br>
<span class="pv">Dt 5010 — Kt 5110</span> bankdan kassaga pul olindi<br>
<span class="pv">Dt 5110 — Kt 5010</span> kassadan bankka topshirildi<br>
<span class="pv">Dt 5010 — Kt 4010</span> xaridor naqd to'ladi<br>
<span class="pv">Dt 4220 — Kt 5010</span> hisobdor shaxsga berildi<br>
<span class="pv">Dt 6710 — Kt 5010</span> ish haqi berildi</p>
<p>Diqqat: kassa limiti bor. Ortiqcha naqd pulni bankka topshirish kerak.</p>`,
acc:[["5010","Kassa"],["4220","Hisobdor shaxslar"],["6710","Ish haqi"]],
q:[
{q:"Kassadan hisobdor shaxsga 500 ming so'm berildi.",o:["Dt 4220 — Kt 5010","Dt 5010 — Kt 4220","Dt 6710 — Kt 5010","Dt 4220 — Kt 5110"],c:0,w:"Hisobdor shaxs endi sizga qarzdor (4xxx debetga), kassadan pul chiqdi (5010 kreditga)."},
{q:"Kassadan xodimlarga ish haqi berildi.",o:["Dt 6710 — Kt 5010","Dt 5010 — Kt 6710","Dt 9420 — Kt 5010","Dt 6710 — Kt 5110"],c:0,w:"Ish haqi qarzi kamaydi → 6710 debetga. Kassadan pul chiqdi → 5010 kreditga."},
{q:"Kassa schyotining qoldig'i kreditda chiqdi. Bu nimani bildiradi?",o:["Xato bor, tekshirish kerak","Normal holat","Foyda bor","Qarz bor"],c:0,w:"Kassa aktiv schyot — qoldig'i faqat debetda bo'ladi. Kredit qoldiq = xato yoki hujjat yetishmayapti."},
{q:"Kassaga pul kirganda qaysi hujjat rasmiylashtiriladi?",o:["Kirim orderi (KO-1)","Chiqim orderi (KO-2)","Faktura","Shartnoma"],c:0,w:"KO-1 — kirim orderi. KO-2 esa pul berilganda."},
{q:"Xaridor tovar uchun kassaga naqd to'ladi.",o:["Dt 5010 — Kt 4010","Dt 4010 — Kt 5010","Dt 5010 — Kt 9020","Dt 5110 — Kt 4010"],c:0,w:"Kassaga pul kirdi (debet), xaridorning qarzi yopildi (4010 kreditga)."},
{q:"Kassadan bankka 10 mln topshirildi.",o:["Dt 5110 — Kt 5010","Dt 5010 — Kt 5110","Dt 5110 — Kt 6010","Dt 5010 — Kt 4010"],c:0,w:"Bankda ko'paydi (5110 debet), kassadan chiqdi (5010 kredit)."}
]},

{n:5,t:"Bank — hisob-kitob schyoti (5110)",
th:`<p><b>5110 — Hisob-kitob schyoti</b>, aktiv. Korxonaning asosiy bank schyoti, milliy valyutada.</p>
<p>Debetda — pul tushumi, kreditda — to'lovlar. Asosiy hujjat: <b>to'lov topshiriqnomasi</b> va <b>bank ko'chirmasi</b> (vipiska).</p>
<p>Muhim odat: har kuni bank ko'chirmasini oling va har bir qatorni provodkaga aylantiring. Ko'chirmadagi qoldiq 5110 dagi qoldiq bilan mos kelishi shart.</p>
<p>Tez-tez uchraydiganlari:<br>
<span class="pv">Dt 5110 — Kt 4010</span> xaridordan tushum<br>
<span class="pv">Dt 5110 — Kt 6310</span> xaridordan bo'nak (avans)<br>
<span class="pv">Dt 6010 — Kt 5110</span> yetkazib beruvchiga to'lov<br>
<span class="pv">Dt 6410 — Kt 5110</span> soliq to'landi<br>
<span class="pv">Dt 9430 — Kt 5110</span> bank xizmati haqi</p>
<p>Diqqat: bankdan pul tushgani — har doim daromad degani emas. Bo'nak bo'lishi mumkin, qarz qaytishi ham mumkin.</p>`,
acc:[["5110","Hisob-kitob schyoti"],["6310","Olingan bo'naklar"],["9430","Boshqa operatsion xarajatlar"]],

{n:6,t:"Mol yetkazib beruvchilar (6010)",
th:`<p><b>6010 — Mol yetkazib beruvchilar va pudratchilarga to'lanadigan schyotlar</b>, passiv.</p>
<p>Tovar yoki xizmat olganingizda qarz paydo bo'ladi → <b>kreditga</b>. To'laganingizda qarz kamayadi → <b>debetga</b>.</p>
<p>Tipik ketma-ketlik (QQS to'lovchi korxona uchun, tovar 12 mln + QQS 12% = 1.44 mln):<br>
<span class="pv">Dt 2910 — Kt 6010</span> 12 000 000 — tovar kirim qilindi<br>
<span class="pv">Dt 4410 — Kt 6010</span> 1 440 000 — hisobga olinadigan QQS<br>
<span class="pv">Dt 6010 — Kt 5110</span> 13 440 000 — to'lov amalga oshirildi</p>
<p>Asosiy hujjat — <b>hisob-faktura</b> (schyot-faktura). Provodka faktura sanasi bo'yicha qilinadi, to'lov sanasi bo'yicha emas.</p>
<p>6010 ni <b>har bir kontragent bo'yicha alohida</b> yuritish kerak (analitik hisob). Umumiy qoldiq nolga teng bo'lsa ham, bir firmaga qarzdor, boshqasidan haqdor bo'lishingiz mumkin.</p>`,

{n:7,t:"TAKROR — 1-hafta",
th:`<p>Birinchi hafta poydevor edi. Nimalarni bilib oldingiz:</p>
<p>• Har bir operatsiya ikkita schyotga tushadi, summalar teng<br>
• Aktiv: ko'payish debetda, qoldiq debetda<br>
• Passiv: ko'payish kreditda, qoldiq kreditda<br>
• 4 — menga qarzdor, 6 — men qarzdorman, 5 — pul<br>
• Kassa (5010), bank (5110), yetkazib beruvchi (6010)</p>
<p>Endi aralash savollar. Shoshilmang — har bir savolda avval "aktivmi, passivmi?" deb o'ylang, keyin "ko'paydimi, kamaydimi?".</p>`,

{n:8,t:"Xaridorlar bilan hisob-kitob (4010)",
th:`<p><b>4010 — Xaridorlar va buyurtmachilardan olinadigan schyotlar</b>, aktiv.</p>
<p>Tovar jo'natilganda yoki xizmat ko'rsatilganda xaridor qarzdor bo'ladi → <b>debetga</b>. Pul kelganda qarz yopiladi → <b>kreditga</b>.</p>
<p>To'liq sotuv sikli (tovar 20 mln + QQS 12%, tannarxi 15 mln):<br>
<span class="pv">Dt 4010 — Kt 9020</span> 22 400 000 — sotuv summasi (QQS bilan)<br>
<span class="pv">Dt 9020 — Kt 6410</span> 2 400 000 — QQS ajratildi<br>
<span class="pv">Dt 9120 — Kt 2910</span> 15 000 000 — tannarx hisobdan chiqarildi<br>
<span class="pv">Dt 5110 — Kt 4010</span> 22 400 000 — pul keldi</p>
<p>Diqqat: daromad <b>tovar berilganda</b> tan olinadi, pul kelganda emas. Bu — hisoblash usuli (нарашение), O'zbekistonda majburiy.</p>
<p>4010 ni ham har bir xaridor bo'yicha alohida yuriting. Kim, qancha, qachondan beri qarzdor — bu ma'lumot sizga har oy kerak bo'ladi.</p>`,

{n:9,t:"Bo'naklar — berilgan va olingan (4310 / 6310)",
th:`<p>Bo'nak (avans) — tovar yoki xizmat hali berilmasidan oldin to'langan pul. Buxgalteriyada bu <b>daromad ham, xarajat ham emas</b> — shunchaki qarz.</p>
<p><b>4310 — Berilgan bo'naklar</b> (aktiv). Siz yetkazib beruvchiga oldindan to'ladingiz. Endi u sizga qarzdor:<br>
<span class="pv">Dt 4310 — Kt 5110</span> bo'nak o'tkazildi<br>
<span class="pv">Dt 2910 — Kt 6010</span> keyinroq tovar keldi<br>
<span class="pv">Dt 6010 — Kt 4310</span> bo'nak hisobga olindi (zachyot)</p>
<p><b>6310 — Olingan bo'naklar</b> (passiv). Xaridor sizga oldindan to'ladi. Endi siz unga qarzdorsiz:<br>
<span class="pv">Dt 5110 — Kt 6310</span> bo'nak keldi<br>
<span class="pv">Dt 4010 — Kt 9020</span> keyin tovar jo'natildi<br>
<span class="pv">Dt 6310 — Kt 4010</span> bo'nak hisobga olindi</p>
<p>Eng ko'p qilinadigan xato: bo'nakni to'g'ridan-to'g'ri daromadga yozib yuborish. Unda soliq bazasi noto'g'ri chiqadi.</p>`,

{n:10,t:"Hisobdor shaxslar (4220)",
th:`<p><b>4220 — Hisobdor shaxslarga berilgan bo'naklar</b>, aktiv. Xalq tilida "podotchet".</p>
<p>Xodimga xarajat uchun pul beriladi. U pulni sarflab, <b>avans hisoboti</b> va cheklarni keltiradi. Shunda qarzi yopiladi.</p>
<p>To'liq sikl (500 ming berildi, 420 mingga material olindi, 80 ming qaytdi):<br>
<span class="pv">Dt 4220 — Kt 5010</span> 500 000 — pul berildi<br>
<span class="pv">Dt 1010 — Kt 4220</span> 420 000 — hisobot qabul qilindi<br>
<span class="pv">Dt 5010 — Kt 4220</span> 80 000 — qoldiq qaytarildi</p>
<p>Agar xodim o'z pulidan ortiqcha sarflagan bo'lsa, teskarisi: <span class="pv">Dt 4220 — Kt 5010</span> bilan farq qoplanadi.</p>
<p>Amaliy maslahat: eski podotchetlar yopilmay yig'ilib qolishi — tekshiruvda birinchi ko'zga tashlanadigan narsa. Har oy 4220 qoldig'ini ko'rib chiqing.</p>`,

{n:11,t:"QQS — kirim (hisobga olinadigan, 4410)",
th:`<p>QQS ikki tomonlama ishlaydi: siz sotib olganingizda <b>to'laysiz</b>, sotganingizda <b>undirasiz</b>. Byudjetga faqat farqini to'laysiz.</p>
<p><b>4410 — Byudjetga to'lovlar bo'yicha bo'naklar</b> (aktiv). Kirim QQS shu yerda yig'iladi — bu byudjetning sizga "qarzi".</p>
<p>Tovar 10 mln + QQS 12% = 1.2 mln:<br>
<span class="pv">Dt 2910 — Kt 6010</span> 10 000 000<br>
<span class="pv">Dt 4410 — Kt 6010</span> 1 200 000<br>
Jami qarz: 11.2 mln, lekin tovar tannarxi — 10 mln.</p>
<p><b>Muhim shart:</b> kirim QQS ni hisobga olish uchun to'g'ri rasmiylashtirilgan <b>elektron hisob-faktura</b> bo'lishi kerak. Fakturasiz QQS — hisobga olinmaydi va tovar tannarxiga qo'shiladi.</p>
<p>Agar korxona QQS to'lovchisi bo'lmasa, 4410 ishlatilmaydi — QQS to'g'ridan-to'g'ri tovar qiymatiga qo'shiladi: <span class="pv">Dt 2910 — Kt 6010</span> 11 200 000.</p>`,

{n:12,t:"QQS — chiqim va byudjet bilan hisob-kitob (6410)",
th:`<p><b>6410 — Byudjetga to'lovlar bo'yicha qarz</b>, passiv. Bu yerda barcha soliqlar turadi: QQS, JShDS, foyda solig'i, ijtimoiy soliq. Har biri alohida subschyotda yuritiladi.</p>
<p>Sotuvda QQS: <span class="pv">Dt 9020 — Kt 6410</span></p>
<p>Oy oxirida hisobga olish (zachyot). Chiqim QQS 3 mln, kirim QQS 1.2 mln bo'lsa:<br>
<span class="pv">Dt 6410 — Kt 4410</span> 1 200 000 — kirim QQS hisobga olindi<br>
6410 da qoladi: 1 800 000 — byudjetga to'lanadi<br>
<span class="pv">Dt 6410 — Kt 5110</span> 1 800 000 — to'lov</p>
<p>Agar kirim QQS chiqimdan ko'p bo'lsa, 6410 debet qoldiq beradi — bu byudjetdan qaytarib olish yoki keyingi oyga o'tkazish huquqi.</p>
<p>Nazorat usuli: QQS hisoboti (deklaratsiya) summasi 6410 dagi oborot bilan mos kelishi shart. Mos kelmasa — provodkalarda uzilish bor.</p>`,

{n:13,t:"Materiallar va xom ashyo (1010)",
th:`<p><b>1010 — Xom ashyo va materiallar</b>, aktiv. Ishlab chiqarishda yoki xo'jalik ehtiyojida ishlatiladigan zaxiralar.</p>
<p>Kirim: <span class="pv">Dt 1010 — Kt 6010</span> (yoki Kt 4220 — podotchet orqali olingan bo'lsa)</p>
<p>Chiqim yo'nalishga qarab:<br>
<span class="pv">Dt 2010 — Kt 1010</span> ishlab chiqarishga berildi<br>
<span class="pv">Dt 9420 — Kt 1010</span> ma'muriy ehtiyojga (ofis)<br>
<span class="pv">Dt 9410 — Kt 1010</span> sotish jarayoniga (qadoqlash)</p>
<p><b>Tovar va material farqi:</b> tovar (2910) — qayta sotish uchun olingan. Material (1010) — ishlatish uchun. Bir xil predmet ikki xil schyotda bo'lishi mumkin: do'kon uchun sotiladigan lampochka — 2910, o'z ofisiga o'rnatiladigani — 1010.</p>
<p>Baholash: kirim narxi bo'yicha. Hisobdan chiqarish o'rtacha narx yoki FIFO usulida — korxona hisob siyosatida tanlanadi va yil davomida o'zgarmaydi.</p>`,

{n:14,t:"TAKROR — 2-hafta",
th:`<p>Ikkinchi hafta hisob-kitoblar va QQS haqida edi:</p>
<p>• 4010 — xaridorlar, daromad tovar berilganda tan olinadi<br>
• 4310 / 6310 — bo'naklar, bular daromad ham xarajat ham emas<br>
• 4220 — podotchet, avans hisoboti bilan yopiladi<br>
• 4410 — kirim QQS, 6410 — chiqim QQS va boshqa soliqlar<br>
• 1010 — materiallar, chiqimi yo'nalishga qarab har xil schyotga</p>
<p>Bu haftaning eng ko'p xatosi: bo'nakni daromad deb yozib yuborish va QQS ni tannarxga qo'shib yuborish. Savollarda shularga e'tibor bering.</p>`,

{n:15,t:"Tovarlar kirimi (2910)",
th:`<p><b>2910 — Omborlardagi tovarlar</b>, aktiv. Savdo korxonasining asosiy schyoti.</p>
<p>Tovar <b>haqiqiy tannarxda</b> kirim qilinadi. Bu faqat faktura summasi emas:</p>
<p>Tannarx = tovar qiymati (QQSsiz) + transport + yuklash + bojxona to'lovlari + sug'urta</p>
<p><span class="pv">Dt 2910 — Kt 6010</span> tovar qiymati<br>
<span class="pv">Dt 2910 — Kt 6010</span> transport xarajati (boshqa firma yetkazgan bo'lsa)<br>
<span class="pv">Dt 4410 — Kt 6010</span> QQS (alohida, tannarxga kirmaydi)</p>
<p>Import bo'lsa qo'shimcha: bojxona boji va yig'imlari ham tannarxga qo'shiladi.</p>
<p><b>Analitik hisob</b> — bu yerda hayotiy muhim. Har bir tovar nomi, o'lchov birligi, miqdori va narxi bo'yicha alohida yuritilmasa, ombor qoldig'ini hech qachon to'g'ri chiqara olmaysiz.</p>`,

{n:16,t:"Tovar sotish va tannarxni hisobdan chiqarish",
th:`<p>Sotuv har doim <b>ikki tomonlama</b>: bir tomondan daromad, ikkinchi tomondan tovarning ketishi. Yangi buxgalterlar ko'pincha ikkinchisini unutadi — natijada foyda haqiqatdan yuqori ko'rinadi.</p>
<p>To'liq to'plam (sotuv 30 mln + QQS 3.6 mln, tannarx 22 mln):<br>
<span class="pv">Dt 4010 — Kt 9020</span> 33 600 000 — sotuv<br>
<span class="pv">Dt 9020 — Kt 6410</span> 3 600 000 — QQS<br>
<span class="pv">Dt 9120 — Kt 2910</span> 22 000 000 — tannarx</p>
<p>Yalpi foyda = 30 000 000 − 22 000 000 = <b>8 000 000</b></p>
<p>Diqqat: <b>9020 — sotuv narxi</b>, <b>9120 — tannarx</b>. Ikkalasi har xil summa. Agar ular teng chiqsa, tannarx noto'g'ri hisoblangan.</p>
<p>Tannarx qanday aniqlanadi — hisob siyosatiga bog'liq: o'rtacha tortilgan narx yoki FIFO. Savdoda ko'pincha o'rtacha narx qulayroq.</p>`,
acc:[["9020","Tovar sotishdan daromad"],["9120","Sotilgan tovar tannarxi"],["2910","Tovarlar"]],

{n:17,t:"Tovar qoldig'i va inventarizatsiya",
th:`<p>Ombor qoldig'i formulasi — buxgalteriyaning eng ko'p ishlatiladigan tenglamasi:</p>
<p class="fm">Boshlang'ich qoldiq + Kirim − Chiqim = Oxirgi qoldiq</p>
<p>Bu formula ham summa bo'yicha, ham <b>miqdor bo'yicha</b> ishlashi kerak. Ikkalasi mos kelmasa — xato bor.</p>
<p><b>Manfiy qoldiq</b> — eng ko'p uchraydigan muammo. Sabablari:<br>
• kirim faktura kiritilmagan yoki kech kiritilgan<br>
• bir tovar ikki xil nom bilan yuritilgan ("Sement M400" va "sement м400")<br>
• o'lchov birliklari aralashib ketgan (dona / quti / kg)<br>
• sotuv miqdori noto'g'ri kiritilgan</p>
<p><b>Inventarizatsiya</b> — haqiqiy sanoq bilan hisob ma'lumotini solishtirish.<br>
Kam chiqsa (nedostacha): <span class="pv">Dt 5910 — Kt 2910</span>, keyin aybdorga yoki xarajatga.<br>
Ortiq chiqsa (izlishka): <span class="pv">Dt 2910 — Kt 9390</span> — boshqa daromad.</p>`,

q:[

{n:18,t:"Asosiy vositalar kirimi (0100)",
th:`<p><b>Asosiy vosita</b> — bir yildan ortiq ishlatiladigan va belgilangan qiymat chegarasidan qimmat mulk: bino, mashina, uskuna, kompyuter, mebel.</p>
<p>Guruhlar: 0110 yer, 0120 binolar, 0130 mashina va uskunalar, 0140 mebel, 0150 transport, 0160 kompyuter texnikasi.</p>
<p>Kirim ikki bosqichda bo'ladi — <b>0820</b> (sotib olish) orqali:<br>
<span class="pv">Dt 0820 — Kt 6010</span> uskuna sotib olindi<br>
<span class="pv">Dt 4410 — Kt 6010</span> QQS<br>
<span class="pv">Dt 0820 — Kt 6010</span> yetkazish va o'rnatish xarajati<br>
<span class="pv">Dt 0130 — Kt 0820</span> foydalanishga topshirildi (dalolatnoma bilan)</p>
<p>Nega ikki bosqich? Chunki uskuna ishga tushgunicha xarajatlar yig'iladi. Boshlang'ich qiymat = narx + transport + o'rnatish + sozlash.</p>
<p>Foydalanishga topshirish <b>OS-1 dalolatnomasi</b> bilan rasmiylashtiriladi. Shu sanadan amortizatsiya boshlanadi (aniqrog'i — keyingi oydan).</p>`,

{n:19,t:"Amortizatsiya — eskirish (0200)",
th:`<p>Asosiy vosita bir yo'la xarajatga yozilmaydi. Uning qiymati foydali xizmat muddati davomida <b>bo'lib-bo'lib</b> xarajatga o'tkaziladi. Bu — amortizatsiya (eskirish).</p>
<p><b>0200 guruhi</b> — eskirish schyotlari, passiv. Ular asosiy vosita qiymatini kamaytirib turadi (kontraktiv schyot). 0230 — mashina va uskunalar eskirishi, 0220 — binolar, 0250 — transport.</p>
<p>Provodka — <b>yo'nalishga qarab</b>:<br>
<span class="pv">Dt 2010 — Kt 0230</span> ishlab chiqarish uskunasi<br>
<span class="pv">Dt 9420 — Kt 0230</span> ofis jihozi<br>
<span class="pv">Dt 9410 — Kt 0250</span> savdo transporti</p>
<p><b>To'g'ri chiziqli usul</b> (eng keng tarqalgani):<br>
Yillik amortizatsiya = Boshlang'ich qiymat ÷ Foydali muddat<br>
Oylik = Yillik ÷ 12</p>
<p>Misol: 60 mln uskuna, 5 yil. Yillik = 12 mln, oylik = 1 mln.</p>
<p><b>Qoldiq qiymat</b> = Boshlang'ich qiymat − Yig'ilgan eskirish. Balansda aynan shu ko'rsatiladi.</p>`,

{n:20,t:"Asosiy vositani sotish va hisobdan chiqarish",
th:`<p>Asosiy vositani chiqarishda uchta narsani yopish kerak: <b>boshlang'ich qiymat</b>, <b>yig'ilgan eskirish</b> va <b>natija</b>.</p>
<p>Misol: 60 mln uskuna, eskirishi 45 mln (qoldiq qiymat 15 mln), 20 mln + QQS 2.4 mln ga sotildi.</p>
<p><span class="pv">Dt 4010 — Kt 9210</span> 22 400 000 — sotuvdan tushum<br>
<span class="pv">Dt 9210 — Kt 6410</span> 2 400 000 — QQS<br>
<span class="pv">Dt 0230 — Kt 0130</span> 45 000 000 — eskirish hisobdan chiqarildi<br>
<span class="pv">Dt 9210 — Kt 0130</span> 15 000 000 — qoldiq qiymat hisobdan chiqarildi</p>
<p>Natija: 20 000 000 − 15 000 000 = <b>5 000 000 foyda</b>. Bu 9210 schyotida qoladi va moliyaviy natijaga o'tadi.</p>
<p>Agar sotuv narxi qoldiq qiymatdan past bo'lsa — zarar. Bu ham normal, faqat hujjat bilan asoslanishi kerak.</p>
<p>To'liq eskirgan (qoldiq qiymati nol) vosita hisobdan chiqarilsa: <span class="pv">Dt 0230 — Kt 0130</span> — bitta provodka bilan yopiladi.</p>`,

{n:21,t:"TAKROR — 3-hafta",
th:`<p>Uchinchi hafta zaxiralar va asosiy vositalar haqida edi:</p>
<p>• 2910 — tovar, tannarxda kirim qilinadi (transport ham qo'shiladi)<br>
• Sotuvda uchta provodka: daromad, QQS, tannarx<br>
• Qoldiq formulasi: boshlang'ich + kirim − chiqim<br>
• 0820 → 0100 — asosiy vosita ikki bosqichda kirim qilinadi<br>
• Amortizatsiya: Dt xarajat — Kt 0200<br>
• Chiqishda: eskirish + qoldiq qiymat + natija</p>
<p>Bu haftaning eng muhim ko'nikmasi — tannarxni unutmaslik. Sotuv bor joyda tannarx ham bo'lishi shart.</p>`,

{n:22,t:"Ish haqi hisoblash (6710)",
th:`<p><b>6710 — Mehnatga haq to'lash bo'yicha xodimlar bilan hisob-kitob</b>, passiv.</p>
<p>Hisoblash — <b>yalpi (brutto) summa</b> bo'yicha, ya'ni ushlanmalardan oldingi summa. Provodka xodim qaysi bo'limda ishlashiga qarab:</p>
<p><span class="pv">Dt 2010 — Kt 6710</span> ishlab chiqarish ishchisi<br>
<span class="pv">Dt 9420 — Kt 6710</span> ma'muriyat, buxgalteriya, direktor<br>
<span class="pv">Dt 9410 — Kt 6710</span> sotuvchi, marketolog</p>
<p>Nega bo'lish muhim? Chunki ishlab chiqarish ishchisining ish haqi mahsulot tannarxiga kiradi, direktorniki esa — yo'q.</p>
<p>Ish haqi bilan bir vaqtda uchta narsa yuz beradi:<br>
1. Xodimga qarz paydo bo'ladi (6710 kredit)<br>
2. Undan JShDS ushlanadi (kamayadi)<br>
3. Korxona ustiga ijtimoiy soliq qo'shiladi (qo'shimcha xarajat)</p>
<p>3-punkt muhim: ijtimoiy soliq xodimdan ushlanmaydi, u <b>korxonaning qo'shimcha xarajati</b>.</p>`,

{n:23,t:"JShDS va ish haqidan ushlanmalar",
th:`<p><b>JShDS</b> — jismoniy shaxslardan olinadigan daromad solig'i. Uni <b>xodim</b> to'laydi, korxona esa faqat ushlab qolib byudjetga o'tkazadi (soliq agenti sifatida).</p>
<p><span class="pv">Dt 6710 — Kt 6410</span> JShDS ushlandi</p>
<p>Diqqat: bu provodka <b>xarajat emas</b>. Xodimga qarz kamayadi, byudjetga qarz paydo bo'ladi. Korxonaning umumiy xarajati o'zgarmaydi.</p>
<p>Boshqa ushlanmalar ham shu tarzda 6710 debetiga yoziladi:<br>
<span class="pv">Dt 6710 — Kt 6410</span> INPS badali<br>
<span class="pv">Dt 6710 — Kt 6970</span> aliment<br>
<span class="pv">Dt 6710 — Kt 4220</span> yopilmagan podotchet ushlandi</p>
<p><b>Hisoblash misoli</b> (JShDS 12%):<br>
Hisoblangan: 5 000 000<br>
JShDS: 5 000 000 × 12% = 600 000<br>
Qo'lga tegadi: 4 400 000</p>
<p>Nazorat: 6710 dagi kredit oborot — hisoblangan yalpi summa; debet oborot — ushlanmalar + to'langan pul.</p>`,

{n:24,t:"Ijtimoiy soliq",
th:`<p>Ijtimoiy soliq — ish beruvchining <b>qo'shimcha</b> majburiyati. Xodimning ish haqidan ushlanmaydi, ustiga qo'shiladi.</p>
<p>Baza — hisoblangan yalpi ish haqi fondi. Stavka faoliyat turiga va korxona toifasiga qarab farq qiladi.</p>
<p>Provodka — ish haqi qaysi schyotga yozilgan bo'lsa, o'sha yerga:<br>
<span class="pv">Dt 9420 — Kt 6410</span> ma'muriy xodimlar bo'yicha<br>
<span class="pv">Dt 2010 — Kt 6410</span> ishlab chiqarish ishchilari bo'yicha<br>
<span class="pv">Dt 9410 — Kt 6410</span> sotuv xodimlari bo'yicha</p>
<p>To'lash: <span class="pv">Dt 6410 — Kt 5110</span></p>
<p><b>Farqni yaxshi tushunib oling:</b><br>
JShDS: <span class="pv">Dt 6710 — Kt 6410</span> — xodimning pulidan, xarajat emas<br>
Ijtimoiy soliq: <span class="pv">Dt 9420 — Kt 6410</span> — korxonaning pulidan, xarajat</p>
<p>Shuning uchun bir xodimning korxonaga haqiqiy narxi ish haqidan yuqori bo'ladi.</p>`,

{n:25,t:"Ish haqini to'lash — to'liq sikl",
th:`<p>Endi hammasini birlashtiramiz. Ma'muriy xodimga 6 000 000 hisoblandi, JShDS 12%, ijtimoiy soliq shartli 12%.</p>
<p><b>1. Hisoblash</b><br>
<span class="pv">Dt 9420 — Kt 6710</span> 6 000 000</p>
<p><b>2. JShDS ushlash</b><br>
<span class="pv">Dt 6710 — Kt 6410</span> 720 000</p>
<p><b>3. Ijtimoiy soliq</b><br>
<span class="pv">Dt 9420 — Kt 6410</span> 720 000</p>
<p><b>4. To'lash</b><br>
<span class="pv">Dt 6710 — Kt 5110</span> 5 280 000</p>
<p><b>5. Soliqlarni o'tkazish</b><br>
<span class="pv">Dt 6410 — Kt 5110</span> 1 440 000</p>
<p>Yakuniy hisob:<br>
Xodim qo'lga oladi: <b>5 280 000</b><br>
Korxona jami sarflaydi: 6 000 000 + 720 000 = <b>6 720 000</b><br>
Byudjetga tushadi: <b>1 440 000</b></p>
<p>6710 schyoti to'liq yopiladi: kredit 6 000 000, debet 720 000 + 5 280 000 = 6 000 000. Qoldiq nol.</p>`,

{n:26,t:"Daromadlar (9000 guruhi)",
th:`<p>9000 guruhi — <b>daromad</b> schyotlari, passiv xarakterda. Daromad kreditga yig'iladi, yil oxirida yopiladi.</p>
<p><b>9010</b> — tayyor mahsulot sotishdan<br>
<b>9020</b> — tovarlar sotishdan<br>
<b>9030</b> — ishlar va xizmatlar ko'rsatishdan<br>
<b>9210</b> — asosiy vositalar chiqishidan<br>
<b>9390</b> — boshqa operatsion daromadlar (jarima, ortiqcha tovar, kurs farqi)</p>
<p><span class="pv">Dt 4010 — Kt 9030</span> xizmat ko'rsatildi<br>
<span class="pv">Dt 9030 — Kt 6410</span> QQS ajratildi</p>
<p><b>Sof daromad</b> = Jami sotuv − QQS − qaytarilgan tovar − chegirmalar</p>
<p>Aynan sof daromad hisobotda ko'rsatiladi va foyda hisobiga kiradi.</p>
<p>Tovar qaytarilsa (storno): <span class="pv">Dt 9020 — Kt 4010</span> — daromad kamayadi. Bir vaqtda tannarx ham qaytariladi: <span class="pv">Dt 2910 — Kt 9120</span>.</p>`,

{n:27,t:"Xarajatlar (9400 guruhi)",
th:`<p>Xarajat schyotlari — <b>9410</b>, <b>9420</b>, <b>9430</b>. Ular debetga yig'iladi.</p>
<p><b>9410 — Sotish xarajatlari:</b> sotuvchilar ish haqi, reklama, qadoqlash, xaridorga yetkazish transporti, savdo do'koni ijarasi.</p>
<p><b>9420 — Ma'muriy xarajatlar:</b> direktor va buxgalteriya ish haqi, ofis ijarasi, aloqa, audit, kantselyariya, ofis jihozlari amortizatsiyasi.</p>
<p><b>9430 — Boshqa operatsion xarajatlar:</b> bank xizmati, jarima va penya, kurs farqi, umidsiz qarzlar.</p>
<p><b>Chegara aniq bo'lishi kerak.</b> Tovarni <i>keltirish</i> transporti — tannarxga (2910). Tovarni <i>xaridorga yetkazish</i> transporti — sotish xarajatiga (9410). Bir xil transport, ikki xil schyot.</p>
<p>Nega bu muhim? Tannarxga qo'shilgan xarajat tovar sotilgunicha kutadi. Sotish xarajati esa darhol joriy davr foydasini kamaytiradi.</p>
<p><span class="pv">Dt 9420 — Kt 6010</span> ofis ijarasi hisoblandi<br>
<span class="pv">Dt 9410 — Kt 6710</span> sotuvchi ish haqi<br>
<span class="pv">Dt 9430 — Kt 5110</span> bank komissiyasi</p>`,

{n:28,t:"TAKROR — 4-hafta",

<script>
/* ---------- saqlash: artifact storage → localStorage → xotira ---------- */
var mem={};
var Store={
  async get(k){
    try{ if(window.storage&&window.storage.get){ var r=await window.storage.get(k); return r?r.value:null; } }catch(e){}
    try{ return localStorage.getItem(k); }catch(e){ return mem[k]||null; }
  },
  async set(k,v){
    try{ if(window.storage&&window.storage.set){ await window.storage.set(k,v); return; } }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; }
  }
};
var KEY='provodka30';
var state={done:[]};

async function load(){
  var raw=await Store.get(KEY);
  if(raw){ try{ var p=JSON.parse(raw); if(p&&Array.isArray(p.done)) state=p; }catch(e){} }
  renderHome();
}
async function save(){ await Store.set(KEY,JSON.stringify(state)); }

/* ---------- bosh ekran ---------- */
function unlocked(n){ return n===1 || state.done.indexOf(n-1)>-1 || state.done.indexOf(n)>-1; }

function renderHome(){
  document.getElementById('day').className='hide';
  document.getElementById('home').className='';
  var g=document.getElementById('grid'); g.innerHTML='';
  var next=1; while(state.done.indexOf(next)>-1 && next<=30) next++;
  DAYS.forEach(function(d){
    var b=document.createElement('button');
    b.className='d'+(state.done.indexOf(d.n)>-1?' done':'')+(unlocked(d.n)?'':' lock')+(d.n===next?' now':'');
    b.textContent=d.n;
    b.setAttribute('aria-label',d.n+'-kun: '+d.t);
    if(unlocked(d.n)) b.onclick=function(){ openDay(d.n); };
    else b.disabled=true;
    g.appendChild(b);
  });
  var c=state.done.length;
  document.getElementById('pd').textContent=c;
  document.getElementById('pb').style.width=(c/30*100)+'%';
  window.scrollTo(0,0);
}

/* ---------- kun ekrani ---------- */
var cur=null,idx=0,right=0,answered=false;

function openDay(n){
  cur=DAYS[n-1]; idx=0; right=0; answered=false;
  document.getElementById('home').className='hide';
  document.getElementById('day').className='';
  drawDay();
}

function accTable(a){
  if(!a||!a.length) return '';
  return '<table>'+a.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>';
}

function drawDay(){
  var m=document.getElementById('day');
  m.innerHTML=
    '<button class="back" id="bk">&larr; Kunlar ro\'yxati</button>'+
    '<p class="daynum">'+cur.n+'-kun</p>'+
    '<h2>'+cur.t+'</h2>'+
    '<div class="card">'+cur.th+'</div>'+
    accTable(cur.acc)+
    '<div id="qz"></div>';
  document.getElementById('bk').onclick=renderHome;
  drawQ();
  window.scrollTo(0,0);
}

function tCell(txt){
  var m=txt.match(/^Dt\s+(\S+)\s+—\s+Kt\s+(\S+)$/);
  if(!m) return '<div class="plain">'+txt+'</div>';
  return '<div class="t"><div class="side"><span class="k">DT</span><span class="v">'+m[1]+'</span></div>'+
         '<div class="side"><span class="k">KT</span><span class="v">'+m[2]+'</span></div></div>';
}

function drawQ(){
  var z=document.getElementById('qz');
  if(idx>=cur.q.length){ drawEnd(); return; }
  var q=cur.q[idx]; answered=false;
  z.innerHTML=
    '<div class="qhead"><span class="lbl">Savol '+(idx+1)+' / '+cur.q.length+'</span>'+
    '<span class="sc">to\'g\'ri: '+right+'</span></div>'+
    '<p class="q">'+q.q+'</p>'+
    '<div class="opts" id="op"></div><div id="wh"></div>';
  var op=document.getElementById('op');
  q.o.forEach(function(t,i){
    var b=document.createElement('button');
    b.className='o'; b.innerHTML=tCell(t);
    b.onclick=function(){ pick(i,b); };
    op.appendChild(b);
  });
}

function pick(i,btn){
  if(answered) return; answered=true;
  var q=cur.q[idx], ok=(i===q.c);
  if(ok) right++;
  var all=document.querySelectorAll('#op .o');
  all.forEach(function(b,j){
    b.disabled=true;
    if(j===q.c){ b.className='o ok'; b.insertAdjacentHTML('afterbegin','<span class="mark">✓</span>'); }
    else if(j===i){ b.className='o no'; b.insertAdjacentHTML('afterbegin','<span class="mark">✕</span>'); }
    else b.className='o dim';
  });
  document.getElementById('wh').innerHTML=
    '<div class="why'+(ok?'':' no')+'"><b>'+(ok?'To\'g\'ri':'Xato')+'</b>'+q.w+'</div>'+
    '<button class="btn" id="nx">'+(idx+1>=cur.q.length?'Kunni yakunlash':'Keyingi savol')+'</button>';
  document.getElementById('nx').onclick=function(){ idx++; drawQ(); window.scrollTo(0,0); };
}

async function drawEnd(){
  var total=cur.q.length, pass=right>=Math.ceil(total*0.7);
  if(pass && state.done.indexOf(cur.n)<0){ state.done.push(cur.n); await save(); }
  var z=document.getElementById('qz');
  z.innerHTML=
    '<div class="done-box" style="'+(pass?'':'border-color:var(--no);background:var(--no-bg)')+'">'+
      '<div class="big">'+right+' / '+total+'</div>'+
      '<div class="cap">'+(pass
        ? (cur.n<30?'Kun yakunlandi. '+(cur.n+1)+'-kun ochildi.':'Kurs tugadi. Barakalla.')
        : 'O\'tish uchun kamida '+Math.ceil(total*0.7)+' ta to\'g\'ri javob kerak. Qayta urinib ko\'ring.')+'</div>'+
    '</div>'+
    '<button class="btn" id="again">Kunni qaytadan ishlash</button>'+
    '<button class="btn ghost" id="home2">Kunlar ro\'yxati</button>';
  document.getElementById('again').onclick=function(){ idx=0; right=0; drawDay(); };
  document.getElementById('home2').onclick=renderHome;
  window.scrollTo(0,0);
}

load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
